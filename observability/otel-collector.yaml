# Reference OpenTelemetry Collector pipeline for an LLM/agent service.
# Secrets are supplied through environment variables; no credentials belong in git.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Remove sensitive payloads before telemetry fans out to any backend.
  # Attribute names vary by SDK/framework, so production policy should be generated
  # from an approved schema and verified with redaction tests.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: enduser.id
        action: delete
      - key: enduser.email
        action: delete
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: llm.prompt
        action: delete
      - key: llm.completion
        action: delete

  batch:
    send_batch_size: 1024
    timeout: 2s

exporters:
  # Generic OTLP endpoint: Langfuse/Phoenix/another trace backend can sit here.
  otlphttp/trace_backend:
    endpoint: ${env:TRACE_BACKEND_OTLP_ENDPOINT}
    headers:
      Authorization: Bearer ${env:TRACE_BACKEND_TOKEN}

  # Cortex/Thanos/Mimir-compatible remote-write target.
  prometheusremotewrite:
    endpoint: ${env:PROM_REMOTE_WRITE_ENDPOINT}
    headers:
      Authorization: Bearer ${env:PROM_REMOTE_WRITE_TOKEN}

  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/trace_backend, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite, debug]
